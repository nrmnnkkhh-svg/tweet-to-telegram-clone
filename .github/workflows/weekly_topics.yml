name: Weekly Iran Topics Update

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  update-topics:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aiohttp
        run: pip install aiohttp

      - name: Generate weekly Iran news topics
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: python generate_topics.py

      - name: Commit updated topics to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly_context.json
          git diff --staged --quiet || (git commit -m "🗓️ Weekly Iran topics update [skip ci]" && git push)
