name: Clone Channel Forward (Test)

on:
  repository_dispatch:
    types: [forward-clone]
  workflow_dispatch:

concurrency: forward-clone

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run forwarder
        env:
          X_COOKIES_CLONE: ${{ secrets.X_COOKIES_CLONE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py
      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update state"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((2 * i))
          done
