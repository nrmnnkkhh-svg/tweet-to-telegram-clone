name: Clone Channel Forward (Test)

on:
  repository_dispatch:
    types: [forward-clone]
  workflow_dispatch:

concurrency: forward-clone

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run forwarder
        env:
          X_COOKIES_CLONE: ${{ secrets.X_COOKIES_CLONE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          TELEGRAM_CHANNEL: "@CloneIntlbrk"
          BOT_INSTANCE: "clone"
        run: python bot.py
      - name: Commit updated state and logs (with retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json clone_bot.log 2>/dev/null || true
          git add state_duplicate_filter.json state_ai_classifier.json state_message_formatter.json state_telegram_sender.json state_deletion_checker.json 2>/dev/null || true
          if [ -f clone_bot.log.1 ]; then git add clone_bot.log.1; fi
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "[clone] Update state and logs"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((2 * i))
          done
          echo "❌ Failed to push state after 5 retries" >&2
          exit 1
